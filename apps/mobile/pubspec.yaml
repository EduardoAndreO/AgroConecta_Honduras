name: agroconecta_mobile
description: App móvil AgroConecta Honduras — marketplace para caficultores hondureños.
publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Estado + HTTP
  provider: ^6.1.2
  http: ^1.2.1

  # Almacenamiento local
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.4.2

  # UI
  google_fonts: ^6.2.1

  # Utilidades
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
